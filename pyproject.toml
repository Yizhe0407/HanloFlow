[project]
name = "taigi-converter"
version = "0.1.0"
description = "Traditional Chinese to Taiwanese Hokkien converter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msgpack>=1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taigi_converter"]
