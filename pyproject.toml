[project]
name = "taigi-converter"
version = "0.1.0"
description = "Deterministic Traditional Chinese to Taiwanese Hokkien Hanji converter"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["Taiwanese Hokkien", "Taigi", "NLP", "translation", "Hanji"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Traditional)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
taibun = ["msgpack>=1.1.2"]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.12",
]

[project.scripts]
taigi-converter = "taigi_converter.cli:main"

[project.urls]
Homepage = "https://github.com/Yizhe0407/HanloFlow"
Repository = "https://github.com/Yizhe0407/HanloFlow"
Issues = "https://github.com/Yizhe0407/HanloFlow/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/.artifact-build.lock", "**/.review_queue.lock", "**/.review_transaction.json"]

[tool.hatch.build.targets.wheel]
packages = ["taigi_converter"]

[tool.hatch.build.targets.sdist]
include = [
    "/AGENT.md",
    "/README.md",
    "/data",
    "/scripts",
    "/taigi_converter",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
